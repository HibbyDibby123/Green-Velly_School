<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Check Result | Green Valley School
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header">

        <div class="header-inner">

            <div class="logo-area">

                <h1>
                    Green Valley School
                </h1>

                <p>
                    Excellence in Education
                </p>

            </div>


            <nav class="main-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="result.html" class="active">
                    Result
                </a>

                <a href="admin.html">
                    Admin
                </a>

            </nav>

        </div>

    </header>



    <!-- =========================================
         RESULT PAGE
    ========================================== -->

    <main class="result-page">

        <div class="result-container">


            <!-- PAGE HEADING -->

            <div class="section-heading">

                <p class="small-title">
                    STUDENT PORTAL
                </p>

                <h2>
                    Check Your Result
                </h2>

                <div class="heading-line"></div>

                <p>
                    Enter your student information below
                    to view your examination result.
                </p>

            </div>



            <!-- RESULT BOX -->

            <div class="result-box">

                <form id="resultForm">


                    <!-- STUDENT NAME -->

                    <div class="form-group">

                        <label for="studentName">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter your name"
                            required
                        >

                    </div>



                    <!-- ROLL NUMBER -->

                    <div class="form-group">

                        <label for="rollNumber">
                            Roll Number
                        </label>

                        <input
                            type="text"
                            id="rollNumber"
                            placeholder="Enter your roll number"
                            required
                        >

                    </div>



                    <!-- CLASS -->

                    <div class="form-group">

                        <label for="className">
                            Class
                        </label>

                        <input
                            type="text"
                            id="className"
                            placeholder="Enter your class"
                            required
                        >

                    </div>



                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="result-button"
                    >
                        Check Result
                    </button>


                </form>



                <!-- MESSAGE -->

                <div id="resultMessage"></div>



                <!-- RESULT OUTPUT -->

                <div id="resultContainer"></div>


            </div>

        </div>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="site-footer">

        <p>
            © 2026 Green Valley School.
            All rights reserved.
        </p>

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js?v=4"></script>


</body>

</html>
