<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | Green Valley School</title>

    <link rel="stylesheet" href="style.css?v=999">

</head>

<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="site-header">

        <div class="container header-content">

            <a href="index.html" class="school-logo">

                <div class="logo-circle">
                    GV
                </div>

                <div>

                    <h1>
                        Green Valley School
                    </h1>

                    <p>
                        Education • Discipline • Success
                    </p>

                </div>

            </a>


            <nav class="navbar">

                <a href="index.html">
                    Home
                </a>

                <a href="result.html">
                    Result
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="contact.html">
                    Contact
                </a>

                <a href="admin.html" class="active">
                    Admin
                </a>

            </nav>

        </div>

    </header>



    <!-- =========================================
         ADMIN PANEL
    ========================================== -->

    <main class="admin-page">

        <div class="admin-container">


            <!-- PAGE HEADING -->

            <div class="section-heading">

                <p class="small-title">
                    ADMINISTRATION
                </p>

                <h2>
                    Admin Panel
                </h2>

                <div class="heading-line"></div>

                <p>
                    Add and manage student examination results.
                </p>

            </div>



            <!-- =========================================
                 ADD RESULT
            ========================================== -->

            <div class="result-box">

                <h3 style="color:#173b57; margin-bottom:25px;">
                    Add Student Result
                </h3>


                <form id="addResultForm">


                    <!-- STUDENT NAME -->

                    <div class="form-group">

                        <label for="addStudentName">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="addStudentName"
                            placeholder="Enter student name"
                            required
                        >

                    </div>



                    <!-- ROLL NUMBER -->

                    <div class="form-group">

                        <label for="addRollNumber">
                            Roll Number
                        </label>

                        <input
                            type="number"
                            id="addRollNumber"
                            placeholder="Enter roll number"
                            required
                        >

                    </div>



                    <!-- CLASS -->

                    <div class="form-group">

                        <label for="addClassName">
                            Class
                        </label>

                        <select
                            id="addClassName"
                            required
                        >

                            <option value="">
                                Select Class
                            </option>

                            <option value="6">
                                Class 6
                            </option>

                            <option value="7">
                                Class 7
                            </option>

                            <option value="8">
                                Class 8
                            </option>

                            <option value="9">
                                Class 9
                            </option>

                            <option value="10">
                                Class 10
                            </option>

                        </select>

                    </div>



                    <!-- BANGLA -->

                    <div class="form-group">

                        <label for="banglaMarks">
                            Bangla Marks
                        </label>

                        <input
                            type="number"
                            id="banglaMarks"
                            placeholder="Enter Bangla marks"
                            min="0"
                            max="100"
                            required
                        >

                    </div>



                    <!-- ENGLISH -->

                    <div class="form-group">

                        <label for="englishMarks">
                            English Marks
                        </label>

                        <input
                            type="number"
                            id="englishMarks"
                            placeholder="Enter English marks"
                            min="0"
                            max="100"
                            required
                        >

                    </div>



                    <!-- MATHEMATICS -->

                    <div class="form-group">

                        <label for="mathMarks">
                            Mathematics Marks
                        </label>

                        <input
                            type="number"
                            id="mathMarks"
                            placeholder="Enter Mathematics marks"
                            min="0"
                            max="100"
                            required
                        >

                    </div>



                    <!-- SCIENCE -->

                    <div class="form-group">

                        <label for="scienceMarks">
                            Science Marks
                        </label>

                        <input
                            type="number"
                            id="scienceMarks"
                            placeholder="Enter Science marks"
                            min="0"
                            max="100"
                            required
                        >

                    </div>



                    <!-- ADD BUTTON -->

                    <button
                        type="submit"
                        class="result-button"
                    >
                        Add Result
                    </button>

                </form>


                <div id="addResultMessage"></div>

            </div>



            <!-- =========================================
                 SAVED RESULTS
            ========================================== -->

            <div
                class="result-box"
                style="max-width:100%; margin-top:30px;"
            >

                <h3 style="color:#173b57; margin-bottom:20px;">
                    Saved Results
                </h3>

                <div id="adminResults">
                    Loading results...
                </div>

            </div>



            <!-- =========================================
                 LOGOUT
            ========================================== -->

            <div style="text-align:center; margin-top:30px;">

                <button
                    id="logoutButton"
                    class="result-button"
                    style="max-width:250px;"
                >
                    Logout
                </button>

            </div>


        </div>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="site-footer">

        <div class="footer-bottom">

            <p>
                © 2026 Green Valley School.
                All rights reserved.
            </p>

        </div>

    </footer>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="script.js?v=999"></script>

</body>

</html>
